[config]
version_check = false
fallback_color = "#67e8f9"
prefer = "saturation"
source_color_index = 0
caching = true
contrast = 0.15

# Hyprland still receives its compositor colors directly from Matugen.
[templates.hyprland]
input_path = "templates/hyprland.lua.tpl"
output_path = "~/.config/hypr/matugen.lua"

# Every other shell surface is generated from this shared wallpaper palette.
# The post-hook keeps Waybar, notifications, OSD, launchers, the overview,
# settings, lock screen, power menu, and terminal visually synchronized.
[templates.liquid_glass]
input_path = "__HOME__/.config/matugen/templates/liquid-glass-colors.json.tpl"
output_path = "__HOME__/.config/aarav-hyprland/liquid-glass-colors.json"
post_hook = "__HOME__/.local/bin/liquid-glass-apply --refresh --quiet"
