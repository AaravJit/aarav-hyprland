source = __HOME__/.config/hypr/hyprlock-colors.conf

$font = Noto Sans

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1600
}

animations {
    enabled = true

    bezier = cinematic, 0.16, 1, 0.30, 1

    animation = fadeIn, 1, 4.5, cinematic
    animation = fadeOut, 1, 3.5, cinematic
    animation = inputFieldDots, 1, 2.5, cinematic
    animation = inputFieldColors, 1, 3.0, cinematic
}

background {
    monitor = __MONITOR__

    # Current desktop capture, heavily blurred and darkened.
    path = screenshot
    color = $lock_surface

    blur_passes = 4
    blur_size = 9

    noise = 0.010
    contrast = 0.92
    brightness = 0.44
    vibrancy = 0.17
    vibrancy_darkness = 0.06
}

################
# Clock and date
################

label {
    monitor = __MONITOR__
    text = $TIME12

    color = $lock_text
    font_size = 96
    font_family = $font

    shadow_passes = 3
    shadow_size = 7
    shadow_color = rgba(0, 0, 0, 0.72)
    shadow_boost = 1.20

    position = 0, 245
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor = __MONITOR__
    text = cmd[update:60000] date "+%A, %B %d"

    color = $lock_muted
    font_size = 20
    font_family = $font

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.68)

    position = 0, 158
    halign = center
    valign = center
    zindex = 2
}

#####################
# Authentication card
#####################

shape {
    monitor = __MONITOR__

    size = 440, 275
    color = $lock_panel

    rounding = 28

    border_size = 1
    border_color = $lock_outline

    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(0, 0, 0, 0.62)
    shadow_boost = 1.35

    position = 0, -25
    halign = center
    valign = center
    zindex = 0
}

################
# Profile badge
################

shape {
    monitor = __MONITOR__

    size = 78, 78
    color = $lock_primary_container

    rounding = -1

    border_size = 2
    border_color = $lock_primary

    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.52)

    position = 0, 83
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor = __MONITOR__
    text = A

    color = $lock_on_primary_container
    font_size = 30
    font_family = $font

    position = 0, 84
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor = __MONITOR__
    text = $USER

    color = $lock_text
    font_size = 15
    font_family = $font

    position = 0, 26
    halign = center
    valign = center
    zindex = 3
}

################
# Password field
################

input-field {
    monitor = __MONITOR__

    size = 350, 60
    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1

    outer_color = $lock_primary $lock_tertiary 45deg
    inner_color = $lock_panel_high
    font_color = $lock_text

    check_color = $lock_tertiary
    check_text = Authenticating...

    fail_color = $lock_error
    fail_text = $FAIL

    # The outline changes color when Caps Lock is active.
    capslock_color = $lock_caps
    numlock_color = -1
    bothlock_color = $lock_error
    invert_numlock = false

    placeholder_text = Enter password

    fade_on_empty = false
    hide_input = false

    rounding = 18

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.48)

    position = 0, -48
    halign = center
    valign = center
    zindex = 3
}

#############
# Bottom hint
#############

label {
    monitor = __MONITOR__
    text = Enter to unlock  •  Esc clears input

    color = $lock_muted
    font_size = 12
    font_family = $font

    position = 0, -116
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor = __MONITOR__
    text = Locked  •  Hyprland

    color = $lock_muted
    font_size = 12
    font_family = $font

    position = 28, 24
    halign = left
    valign = bottom
    zindex = 2
}
