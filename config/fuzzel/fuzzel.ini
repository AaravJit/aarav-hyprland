[main]
namespace=launcher
font=Noto Sans:size=15,Symbols Nerd Font Mono:size=15
use-bold=yes
dpi-aware=auto
terminal=kitty
layer=overlay
anchor=center

width=58
lines=10
horizontal-pad=28
vertical-pad=22
inner-pad=14
line-height=30px
letter-spacing=0.2

message=Applications
message-mode=expand
prompt=  
placeholder=Search apps, actions, and commands
match-mode=fzf
fields=name,generic,keywords,categories,filename,exec
filter-desktop=yes
show-actions=yes
match-counter=yes
icons-enabled=yes
image-size-ratio=1

[colors]
background=1b2421F2
text=dbe5dfE8
message=ffb598FF
prompt=8fd4c3FF
placeholder=b8cbc3B8
input=dbe5dfFF
match=8fd4c3FF
selection=8f4828CC
selection-text=ffffffFF
selection-match=ffb598FF
counter=b8cbc3B8
border=4e5f59C0

[border]
width=1
radius=24
selection-radius=12

[dmenu]
exit-immediately-if-empty=yes
