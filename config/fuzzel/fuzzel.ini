[main]
namespace=launcher
font=Noto Sans:size=14,Symbols Nerd Font Mono:size=14
use-bold=yes
dpi-aware=auto
terminal=kitty
layer=overlay
anchor=center

width=50
lines=9
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=24px
letter-spacing=0

prompt=
placeholder=Search applications
match-mode=fzf
fields=name,generic,keywords,categories,filename,exec
filter-desktop=yes
show-actions=yes
match-counter=yes
icons-enabled=yes
image-size-ratio=1

[colors]
background=1b2421F0
text=dbe5dfEE
prompt=ffb598FF
placeholder=b8cbc3C8
input=dbe5dfFF
match=8fd4c3FF
selection=8f4828E6
selection-text=ffffffFF
selection-match=ffb598FF
counter=b8cbc3D0
border=ffb59890

[border]
width=1
radius=18
selection-radius=9

[dmenu]
exit-immediately-if-empty=yes
