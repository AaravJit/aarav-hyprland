[main]
font=Noto Sans:size=14
terminal=kitty
layer=overlay
anchor=center

width=48
lines=12

horizontal-pad=22
vertical-pad=14
inner-pad=10

prompt=Search >
placeholder=Applications and commands
match-mode=fzf

[colors]
background=1b2421EB
text=dbe5dfFF
prompt=ffb598FF
placeholder=b8cbc3FF
input=dbe5dfFF
match=8fd4c3FF
selection=8f4828A8
selection-text=ffffffFF
selection-match=ffb598FF
border=4e5f59A0

[border]
width=1
radius=14

[dmenu]
exit-immediately-if-empty=yes
